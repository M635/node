name: Build Linux

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build Tauri app
        run: pnpm tauri build
        env:
          CI: true

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: MarkPT-linux-appimage
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 30

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: MarkPT-linux-deb
          path: |
            src-tauri/target/release/bundle/deb/*.deb
          retention-days: 30

      - name: Show build size
        run: |
          echo "=== 构建产物大小 ==="
          ls -lh src-tauri/target/release/bundle/appimage/*.AppImage 2>/dev/null || echo "AppImage 未找到"
          ls -lh src-tauri/target/release/bundle/deb/*.deb 2>/dev/null || echo "deb 未找到"
