name: Build macOS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build Tauri app (Universal Binary)
        run: pnpm tauri build --target universal-apple-darwin
        env:
          CI: true

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacPad-macos-dmg
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 30

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacPad-macos-app
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          retention-days: 30

      - name: Show build size
        run: |
          echo "=== 构建产物大小 ==="
          ls -lh src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg 2>/dev/null || echo "dmg 未找到"
          ls -lh src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app 2>/dev/null || echo "app 未找到"
