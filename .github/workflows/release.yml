name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布版本号 (如 v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: MarkPT ${{ steps.get_version.outputs.version }}
          body: |
            # MarkPT ${{ steps.get_version.outputs.version }}

            对标 Notepad++ 的轻量化跨平台代码文本编辑器，基于 Tauri 2.x + Rust + React + Monaco Editor。

            ## v2.8.2 更新内容
            - 修复：Monaco 编辑器右键菜单中英文混杂
              - 根因：@monaco-editor/react 通过 loader 从 CDN 加载 monaco（AMD 实例），与 ESM 打包实例不同，内置 Cut/Copy/Paste 英文项无法本地化
              - 禁用 Monaco 内置右键菜单，改用自定义 React 右键菜单（复用 ContextMenu 组件）
              - 菜单项全部走 i18n（剪切/复制/粘贴/查找/替换/转到行/切换注释/格式化/删除行/复制行/插入日期/全选），语言切换即时刷新
            - 修复：命令面板（CommandPalette）窗口无法自适应编辑区，仅屏幕最大化时能完整显示
              - 去掉固定高度，改用 max-height + flex min-height:0，内容少时收缩、多时滚动，小窗口下不再被截断
            - 优化：命令面板快捷键平台适配（macOS 显示 Cmd，Windows/Linux 显示 Ctrl）
            - 优化：语言切换时重新注册编辑器 Action，刷新所有命令标签语言

            ## v2.8.1 更新内容
            - 修复：程序关闭后进程无法正常退出、残留后台进程的问题
              - 统一「前端保存会话 → 后端清理资源 → 退出」的优雅退出流程
              - 后端拦截窗口关闭请求并增加 10 秒兜底看门狗，杜绝进程卡死
              - 新增 SIGINT/SIGTERM 信号监听，收到信号后优雅清理并退出
              - 退出前统一终止「运行命令」启动的子进程（含进程组），释放文件监听句柄，无僵尸进程残留
            - 修复：中文模式下界面混杂英文文案
              - 全部弹窗、按钮、状态标签、提示文本统一简体中文
              - 错误提示改为友好中文（原始错误仅写入调试日志）
              - 语言选择持久化，重启后界面与原生菜单语言一致
              - 修复原生菜单每次重建时的内存泄漏
            - 修复：关闭窗口时异步保存会话被中断，可能丢失未保存内容
            - 修复：会话恢复时未保存的修改被磁盘旧内容覆盖，导致工作内容丢失
            - 修复：「运行命令」「在默认程序打开」菜单点击无反应（事件无人监听）
            - 修复：菜单「开始/停止录制宏、播放宏、保存宏、多次运行宏」点击无反应
            - 修复：剪贴板历史面板始终为空（监听器从未初始化）
            - 修复：文件属性对话框创建/访问时间显示为空
            - 修复：复制标签页副本后未激活新标签
            - 修复：状态栏与欢迎页版本号停留在 v2.0.0（统一取自 tauri.conf.json）
            - 新增：运行命令对话框现在真正执行命令并显示输出（超时自动终止）
            - 新增：设置项与界面语言持久化，重启后生效
            - 新增：后端错误统一映射为中文提示，调试细节只进日志

            ## 功能
            - 多标签页编辑，拖拽排序，右键菜单，标签着色
            - 语法高亮 (100+ 语言)，代码折叠，配对括号高亮
            - 多光标编辑，列块选择，智能高亮
            - 大文件分片懒加载 (1GB+，mmap)
            - 编码识别与转换 (UTF-8/GBK/GB2312/UTF-16/ASCII + BOM)
            - 正则查找替换，搜索高亮，选区内搜索，环绕搜索，全局目录检索
            - 编辑操作: 删除/复制/移动行、大小写转换、排序、注释、去重、过滤、合并/拆分
            - 书签标记，行号跳转，跳转括号
            - 宏录制与回放，多次运行宏
            - 双文件 Diff 对比
            - 分屏编辑 (水平/垂直，同步滚动)
            - 函数列表 (JS/TS/Python/Rust/Java/C/C++/Go 等)
            - 多文档查找替换，批量查找替换
            - 十六进制查看器，字符统计面板
            - 代码片段系统 (Snippets，Tab 展开)
            - 剪贴板历史 (50 条)
            - 插件系统架构 (12 个内置插件)
            - 运行命令，在默认程序打开
            - 便利贴模式 (Post-it)
            - 会话保存/恢复 (自动恢复上次打开文件)
            - 文件变动监听 + 重载提示
            - 命令面板 (Cmd+P)
            - 侧边栏文件树浏览器
            - macOS 原生风格 + 深色/浅色自适应
            - i18n 中英双语
            - 导出 txt/html/rtf
            - 跨平台: macOS / Windows / Linux

            ## 下载安装
            | 平台 | 文件 | 说明 |
            |------|------|------|
            | macOS | `MarkPT-*.dmg` | Universal Binary，拖拽到 Applications 安装 |
            | Windows | `MarkPT-*-setup.exe` | NSIS 安装向导，含卸载程序 |
            | Linux | `MarkPT-*.AppImage` | 绿色免安装，直接运行 |
            | Linux | `MarkPT-*.deb` | Debian/Ubuntu 安装包 |
          draft: false
          prerelease: false

  build-macos:
    needs: create-release
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build
        run: pnpm tauri build --target universal-apple-darwin

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  build-windows:
    needs: create-release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build
        run: pnpm tauri build

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe

  build-linux:
    needs: create-release
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build
        run: pnpm tauri build

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
