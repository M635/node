name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布版本号 (如 v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: MarkPT ${{ steps.get_version.outputs.version }}
          body: |
            # MarkPT ${{ steps.get_version.outputs.version }}

            对标 Notepad++ 的轻量化跨平台文本编辑器，基于 Tauri + Rust + Monaco Editor。

            ## 功能
            - 多标签页编辑，拖拽排序，右键菜单
            - 语法高亮 (100+ 语言)，代码折叠，配对括号高亮
            - 多光标编辑，列块选择
            - 大文件分片懒加载 (1GB+，mmap)
            - 编码识别与转换 (UTF-8/GBK/GB2312/UTF-16/ASCII)
            - 正则查找替换，搜索高亮，全局目录检索
            - 编辑操作: 删除/复制/移动行、大小写转换、排序、注释、去重
            - 书签标记，行号跳转
            - 宏录制与回放
            - 双文件 Diff 对比
            - 分屏编辑 (水平/垂直，同步滚动)
            - 函数列表 (JS/TS/Python/Rust/Java/C/C++/Go 等)
            - 多文档查找替换
            - 十六进制查看器
            - 字符统计面板
            - 会话保存/恢复 (自动恢复上次打开文件)
            - 文件变动监听 + 重载提示
            - 命令面板 (Cmd+P)
            - 侧边栏文件树浏览器
            - macOS 原生风格 + 深色/浅色自适应
            - 导出 txt/html/rtf
            - 跨平台: macOS / Windows / Linux

            ## 快捷键
            | 快捷键 | 功能 |
            |--------|------|
            | Cmd/Ctrl+P | 命令面板 |
            | Cmd/Ctrl+S | 保存 |
            | Cmd/Ctrl+F | 查找 |
            | Cmd/Ctrl+H | 替换 |
            | Cmd/Ctrl+G | 跳转行 |
            | Cmd/Ctrl+D | 删除当前行 |
            | Cmd/Ctrl+/ | 切换注释 |
            | Alt+↑/↓ | 上移/下移行 |
            | Cmd+Shift+U | 转大写 |
            | Cmd+Shift+L | 转小写 |
            | Cmd+Shift+F | 多文档搜索 |
            | Cmd+Shift+O | 函数列表 |
            | Cmd+Shift+C | 字符统计 |

            ## 下载
            - macOS: MarkPT-*.dmg (Universal Binary)
            - Windows: MarkPT-*-setup.exe
            - Linux: MarkPT-*.AppImage / *.deb
          draft: false
          prerelease: false

  build-macos:
    needs: create-release
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build
        run: pnpm tauri build --target universal-apple-darwin

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  build-windows:
    needs: create-release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build
        run: pnpm tauri build

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe

  build-linux:
    needs: create-release
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build
        run: pnpm tauri build

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
