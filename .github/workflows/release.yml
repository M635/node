name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布版本号 (如 v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: MarkPT ${{ steps.get_version.outputs.version }}
          body: |
            # MarkPT ${{ steps.get_version.outputs.version }}

            对标 Notepad++ 的轻量化跨平台代码文本编辑器，基于 Tauri 2.x + Rust + React + Monaco Editor。

            ## v2.0.0 重大更新
            - 菜单栏完全对标 Notepad++ 11 菜单结构（文件/编辑/查找/视图/编码/语言/设置/工具/对比/窗口/帮助）
            - 工具栏 5 按钮组（文件/编辑/搜索/视图/对比）对标 Notepad++
            - 新增语言菜单（languageMenu）：直接切换 17 种语法高亮
            - 新增对比菜单（compareMenu）：文件对比/同步滚动/差异导航
            - 新增窗口菜单（windowMenu）：窗口排序（名称/路径/时间）+ 窗口排列（层叠/水平平铺/垂直平铺）
            - 修复 documentTabBar 渲染异常：标签项文本与下拉面板正常绘制
            - 修复 windowMenu 窗口排序与排列功能失效
            - 全新绿色主题 UI，白底绿字 MPT 品牌图标
            - NSIS 安装向导 + 卸载程序（Windows）
            - DMG 安装包（macOS Universal Binary）
            - AppImage 绿色免安装版（Linux）

            ## 功能
            - 多标签页编辑，拖拽排序，右键菜单，标签着色
            - 语法高亮 (100+ 语言)，代码折叠，配对括号高亮
            - 多光标编辑，列块选择，智能高亮
            - 大文件分片懒加载 (1GB+，mmap)
            - 编码识别与转换 (UTF-8/GBK/GB2312/UTF-16/ASCII + BOM)
            - 正则查找替换，搜索高亮，选区内搜索，环绕搜索，全局目录检索
            - 编辑操作: 删除/复制/移动行、大小写转换、排序、注释、去重、过滤、合并/拆分
            - 书签标记，行号跳转，跳转括号
            - 宏录制与回放，多次运行宏
            - 双文件 Diff 对比
            - 分屏编辑 (水平/垂直，同步滚动)
            - 函数列表 (JS/TS/Python/Rust/Java/C/C++/Go 等)
            - 多文档查找替换，批量查找替换
            - 十六进制查看器，字符统计面板
            - 代码片段系统 (Snippets，Tab 展开)
            - 剪贴板历史 (50 条)
            - 插件系统架构 (12 个内置插件)
            - 运行命令，在默认程序打开
            - 便利贴模式 (Post-it)
            - 会话保存/恢复 (自动恢复上次打开文件)
            - 文件变动监听 + 重载提示
            - 命令面板 (Cmd+P)
            - 侧边栏文件树浏览器
            - macOS 原生风格 + 深色/浅色自适应
            - i18n 中英双语
            - 导出 txt/html/rtf
            - 跨平台: macOS / Windows / Linux

            ## 下载安装
            | 平台 | 文件 | 说明 |
            |------|------|------|
            | macOS | `MarkPT-*.dmg` | Universal Binary，拖拽到 Applications 安装 |
            | Windows | `MarkPT-*-setup.exe` | NSIS 安装向导，含卸载程序 |
            | Linux | `MarkPT-*.AppImage` | 绿色免安装，直接运行 |
            | Linux | `MarkPT-*.deb` | Debian/Ubuntu 安装包 |
          draft: false
          prerelease: false

  build-macos:
    needs: create-release
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build
        run: pnpm tauri build --target universal-apple-darwin

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  build-windows:
    needs: create-release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build
        run: pnpm tauri build

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe

  build-linux:
    needs: create-release
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build
        run: pnpm tauri build

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
