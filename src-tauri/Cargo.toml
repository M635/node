[package]
name = "markpt"
version = "2.8.3"
description = "macOS 轻量化文本编辑器"
authors = ["MarkPT"]
edition = "2021"
rust-version = "1.75"

[lib]
name = "markpt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["macos-private-api"] }
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-window-state = "2.0"
tauri-plugin-clipboard-manager = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
encoding_rs = "0.8"
chardetng = "0.1"
notify = "6"
notify-debouncer-mini = "0.4"
memmap2 = "0.9"
rayon = "1.10"
regex = "1.11"
walkdir = "2.5"
anyhow = "1.0"
parking_lot = "0.12"
log = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dev]
incremental = true
